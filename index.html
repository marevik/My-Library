<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашня Бібліотека</title>
    
    <link rel="icon" href="app_icon.png" type="image/png">
    
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="app_icon.png"> -->
    
    <meta name="theme-color" content="#673AB7"> <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Моя Домашня Бібліотека</h1>
        <span id="bookCount" class="count-display">Усього книг: 0</span>
        <button id="openModalBtn">📚 Додати Книгу</button>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Пошук за назвою або автором..." onkeyup="filterBooks()">
    </div>
    <div class="backup-controls">
    <button onclick="exportBooks()" title="Зберегти всі книги у файл">📥 Зберегти копію (Експорт)</button>
    <button onclick="document.getElementById('importFile').click()" title="Відновити з файлу">📤 Відновити з копії (Імпорт)</button>
    <input type="file" id="importFile" style="display:none" onchange="importBooks(event)">
</div>

    <div class="book-list-container" id="bookList">
        </div>

    <div id="addBookModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Додати нову книгу</h2>
            
            <form id="addBookForm">
                <label for="title">Назва Книги:</label>
                <input type="text" id="title" required><br>
                
                <label for="author">Автор:</label>
                <input type="text" id="author" required><br>
                
                <label for="imageURL">Посилання на Фото (URL):</label>
                <input type="url" id="imageURL" placeholder="https://example.com/photo.jpg" ><br>
                
                <button type="submit">Зберегти Книгу</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
