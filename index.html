<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашня Бібліотека</title>
    
    <meta name="theme-color" content="#0b0e14">
    
    <link rel="stylesheet" href="style.css?v=1.3">
</head>
<body>

    <header>
        <div class="title-wrapper" onclick="toggleDropdown(event)">
            <h1 id="headerTitle">Моя Домашня Бібліотека <span class="arrow">▼</span></h1>
            <div id="backupDropdown" class="dropdown-content">
                <button onclick="exportBooks()">📥 Зберегти копію (Експорт)</button>
                <button onclick="document.getElementById('importFile').click()">📤 Відновити з копії (Імпорт)</button>
            </div>
        </div>
        
        <div class="count-wrapper">
    <div class="count-item">📚 Усього: <span id="bookCount">0</span></div>
    <div class="count-item">✅ Прочитано: <span id="readCount">0</span></div>
</div>
        <button id="openModalBtn">📚 Додати</button>
    </header>
<div class="tabs-container">
    <button class="tab-btn active" onclick="filterByType('all')">Всі</button>
    <button class="tab-btn" onclick="filterByType('paper')">📖 Паперові</button>
    <button class="tab-btn" onclick="filterByType('ebook')">📱 Е-книги</button>
    <button class="tab-btn" onclick="filterByType('audio')">🎧 Аудіо</button>
</div>


    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Пошук за назвою або автором...">
    </div>

    <input type="file" id="importFile" style="display:none" onchange="importBooks(event)">

    <div class="book-list-container" id="bookList"></div>

    <div id="addBookModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Додати нову книгу</h2>
            
            <form id="addBookForm">
                <input type="text" id="title" placeholder="Назва книги" required>
                <input type="text" id="author" placeholder="Автор" required>
                <input type="url" id="imageURL" placeholder="Посилання на обкладинку (URL)">
                <button type="submit">Зберегти</button>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
        <h2 id="detailsTitle">Назва книги</h2>
        <p id="detailsAuthor" style="color: var(--text-muted); margin-bottom: 20px;"></p>
        
        <div style="margin: 20px 0;">
            <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                <input type="checkbox" id="detailsReadStatus" style="width: 18px; height: 18px;"> 
                <span>Прочитано</span>
            </label>
        </div>

        <div id="starsInput" style="font-size: 1.8rem; color: #ffca08; cursor: pointer; margin-bottom: 20px;">
            <span class="star" data-value="1">☆</span>
            <span class="star" data-value="2">☆</span>
            <span class="star" data-value="3">☆</span>
            <span class="star" data-value="4">☆</span>
            <span class="star" data-value="5">☆</span>
        </div>
<div style="margin-bottom: 20px;">
    <p style="margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted);">Тип книги:</p>
    <select id="detailsBookType" style="width: 100%; padding: 10px; background: var(--bg-color); color: white; border: 1px solid var(--border-color); border-radius: 8px; outline: none;">
        <option value="paper">📖 Паперова</option>
        <option value="ebook">📱 Електронна</option>
        <option value="audio">🎧 Аудіокнига</option>
    </select>
</div>
        <button id="saveDetailsBtn" style="width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px;">Зберегти зміни</button>
        
        <div style="display: flex; gap: 10px;">
            <button id="goToEditBtn" style="flex: 2; padding: 10px; background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-size: 0.85rem;">⚙️ Редагувати</button>
            <button id="deleteInDetailsBtn" style="flex: 1; padding: 10px; background: rgba(248, 81, 73, 0.1); color: var(--danger); border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-size: 0.85rem;">🗑 Вид.</button>
        </div>
    </div>
</div>

    <script src="script.js?v=1.2"></script>
</body>
</html>
